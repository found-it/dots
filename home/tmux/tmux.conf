# ~/.tmux.conf
#
# Loaded via dotfiles/tmux/install.sh (symlinked into $HOME).
# Terminals: Ghostty on macOS, whatever ships with the distro on Linux.

# --- Prefix ---------------------------------------------------------------
# C-h is also ASCII BS, so C-h in a pane no longer deletes a character.
# Press it twice to send a literal C-h through.
unbind C-b
set -g prefix C-h
bind C-h send-prefix

# --- Terminal -------------------------------------------------------------
# tmux-256color gives nvim italics and 256 colors; terminal-features layers
# truecolor and undercurl on top for whatever terminal is outside.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"      # 24-bit colour
set -as terminal-features ",*:usstyle"  # undercurl + coloured underlines
set -g allow-passthrough on             # let nvim/imgcat emit raw escapes
set -g set-clipboard on                 # OSC 52: yanks reach the system clipboard

# Login shell is zsh, so this is load-bearing. Resolved at runtime rather
# than hardcoded, since the Nix path does not exist on Linux.
run 'tmux set -g default-shell "$(command -v fish || echo "$SHELL")"'

set -g focus-events on
set -s escape-time 0

# --- Windows and panes ----------------------------------------------------
set -g base-index 1              # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on       # no gaps after closing a window
setw -g mode-keys vi
set -g status-position top
set -g mouse on

# --- Window navigation (no prefix) ----------------------------------------
bind -n M-Down  new-window -c "#{pane_current_path}"
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-Up    swap-window -d -t :-1   # move this window one slot left

# --- Pane navigation ------------------------------------------------------
# Shift+arrow needs no terminal setup anywhere; prefix+hjkl is the portable
# vim-style equivalent. Alt+hjkl is deliberately avoided: on macOS, Option
# composes accented characters unless Ghostty sets macos-option-as-alt.
bind -n S-Left  select-pane -L
bind -n S-Down  select-pane -D
bind -n S-Up    select-pane -U
bind -n S-Right select-pane -R

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Splits and resizing (prefix) -----------------------------------------
# All three inherit the current pane's directory.
bind c new-window      -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# -r makes these repeatable: hold the key after one prefix press.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode ------------------------------------------------------------
# set-clipboard above handles the OS clipboard over OSC 52, so no pbcopy.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Misc -----------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Plugins --------------------------------------------------------------
# catppuccin is pinned: v2 renamed most options, so an unpinned update
# would silently blank the status bar.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin reads these on load and will not overwrite them, so they must
# be set before the plugin runs.
set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{pane_current_path}"
set -g @catppuccin_date_time_text " %m-%d %H:%M"
set -g @catppuccin_date_time_icon ""

# v2 has no @catppuccin_status_modules_right; the status line is assembled
# by hand from the per-module options the plugin defines.
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
